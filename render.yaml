services:
  - type: web
    name: pulselogix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CACHE_TTL_METRICS_SUMMARY
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: REDIS_ENABLED
        value: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
